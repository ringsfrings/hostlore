<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Secrets - NetScanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container" style="max-width: 520px; margin-top: 60px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title text-center mb-4">🔐 Reset Encrypted Secrets</h4>
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="ip_range" class="form-label">IP Range</label>
            <input type="text" class="form-control" id="ip_range" name="ip_range" placeholder="e.g. 192.168.1.0/24" required>
          </div>
          <div class="mb-3">
            <label for="token" class="form-label">Telegram Bot Token</label>
            <input type="password" class="form-control" id="token" name="token" placeholder="Paste new bot token" required>
          </div>
          <div class="mb-3">
            <label for="chat_id" class="form-label">Telegram Chat ID</label>
            <input type="text" class="form-control" id="chat_id" name="chat_id" required>
          </div>
          <div class="mb-3">
            <label for="db_password" class="form-label">Database Password</label>
            <input type="password" class="form-control" id="db_password" name="db_password" placeholder="New DB password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-warning">♻️ Reset Secrets</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>

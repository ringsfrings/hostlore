name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (with coverage)
        run: pytest --cov=app --cov=db --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-smoke:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare env + secret files
        run: |
          {
            echo "FLASK_SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_USER=netadmin"
            echo "POSTGRES_DB=network_inventory"
            echo "GUNICORN_WORKERS=2"
            echo "GUNICORN_LOG_LEVEL=info"
          } > .env
          mkdir -p secrets
          openssl rand -hex 24 > secrets/db_password.txt
          chmod 600 secrets/db_password.txt

      - name: Build + start stack
        run: docker compose up -d --build

      - name: Wait for app healthcheck
        run: |
          for i in $(seq 1 45); do
            status=$(docker inspect --format='{{.State.Health.Status}}' hostlore-app 2>/dev/null || echo starting)
            echo "attempt $i: hostlore-app health=$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "Container never became healthy"
          docker compose logs
          exit 1

      - name: Probe /health
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Probe /metrics
        run: |
          curl -fsS http://localhost:8000/metrics | head -30
          curl -fsS http://localhost:8000/metrics | grep -q 'hostlore_scans_total'

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e-lab:
    name: E2E — scan a docker lab network
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Run lab (setup → scan → change detection → alerts)
        run: ./lab/e2e.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -p hostlore-lab -f docker-compose.yml -f docker-compose.lab.yml logs

      - name: Tear down
        if: always()
        run: docker compose -p hostlore-lab -f docker-compose.yml -f docker-compose.lab.yml down -v

  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hostlore:ci .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: hostlore:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"        # report only; do not fail the build yet

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

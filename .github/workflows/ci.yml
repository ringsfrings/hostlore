name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (with coverage)
        run: pytest --cov=app --cov=db --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-smoke:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare env + secret files
        run: |
          {
            echo "FLASK_SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_USER=netadmin"
            echo "POSTGRES_DB=network_inventory"
            echo "GUNICORN_WORKERS=2"
            echo "GUNICORN_LOG_LEVEL=info"
          } > .env
          mkdir -p secrets
          openssl rand -hex 24 > secrets/db_password.txt
          chmod 600 secrets/db_password.txt

      - name: Build + start stack
        run: docker compose up -d --build

      - name: Wait for app healthcheck
        run: |
          for i in $(seq 1 45); do
            status=$(docker inspect --format='{{.State.Health.Status}}' hostlore-app 2>/dev/null || echo starting)
            echo "attempt $i: hostlore-app health=$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          echo "Container never became healthy"
          docker compose logs
          exit 1

      - name: Probe /health
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'

      - name: Probe /metrics
        run: |
          curl -fsS http://localhost:8000/metrics | head -30
          curl -fsS http://localhost:8000/metrics | grep -q '^hostlore_scans_total{profile="quick",result="complete"} 0'

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e-lab:
    name: E2E — scan a docker lab network
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Run lab (setup → scan → change detection → alerts)
        run: ./lab/e2e.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -p hostlore-lab -f docker-compose.yml -f docker-compose.lab.yml logs

      - name: Tear down
        if: always()
        run: docker compose -p hostlore-lab -f docker-compose.yml -f docker-compose.lab.yml down -v

  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hostlore:ci .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: hostlore:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"        # report only; do not fail the build yet

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  publish:
    # CD: only after every check passed, only for main and version tags (never for PRs).
    name: Publish image to Docker Hub
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-smoke, e2e-lab, trivy-scan]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hostlore
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
